# Runs the whole demo in containers, no JDK or Node needed:
#   docker compose -f compose.demo.yaml up -d --build
# Then open http://localhost:8080 (shop) or http://localhost:8080/swagger-ui.html (API).
#
# Demo settings: sample data with known passwords and JWT keys generated at startup (a restart
# logs everyone out). The database has no volume: "down" and "up" again resets the demo data.
# (compose.yaml, used by ./mvnw spring-boot:run, only starts the database.)

# Own project name, so these containers never replace the ones from compose.yaml
name: tshop-demo

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tshop
      POSTGRES_USER: tshop
      POSTGRES_PASSWORD: tshop
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tshop -d tshop" ]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tshop
      SPRING_DATASOURCE_USERNAME: tshop
      SPRING_DATASOURCE_PASSWORD: tshop

  # The only published port: the web, which forwards /api and Swagger to "app"
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
