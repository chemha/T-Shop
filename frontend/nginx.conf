# Serves the built web and forwards the API to the backend container, so the browser sees a
# single origin (no CORS), exactly like the Vite proxy does in development.
server {
    listen 80;
    root /usr/share/nginx/html;

    # API, Swagger UI and the contract it displays
    location ~ ^/(api/|swagger-ui|v3/api-docs|openapi\.yaml) {
        proxy_pass http://app:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have a content hash in their name, so they can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: /cart, /admin/orders... are routes of the app, not files
    location / {
        try_files $uri /index.html;
    }
}
