spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  docker:
    compose:
      enabled: false
  flyway:
    # Demo data is only loaded outside production
    locations: classpath:db/migration

logging:
  structured:
    format:
      # One JSON object per line (Elastic Common Schema), ready for a log aggregator.
      # Locally the usual human-readable format is kept
      console: ecs

tshop:
  jwt:
    # Required in production: without them the application refuses to start, instead of
    # silently generating keys that change on every restart
    public-key: ${JWT_PUBLIC_KEY}
    private-key: ${JWT_PRIVATE_KEY}
