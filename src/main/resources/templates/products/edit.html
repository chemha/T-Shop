<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">
    <meta content="" name="description">
    <meta content="" name="author">

    <title>T-Shop - Product edit</title>

    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">

    <!-- Custom styles for this template -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">

    <!-- JQuery core JS -->
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/js/csrf.js}"></script>

    <!-- Bootstrap core JS -->
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

    <!-- Custom JS -->
    <script th:src="@{/js/products/edit.js}" type="text/javascript"></script>

</head>

<body>

<div th:include="base_template::header"></div>

<div class="container p-5">
    <div class="container mx-auto">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card bg-dark text-white">
                    <div class="card-header">
                        <h4 th:text="'Editing product: ' + ${product.title}"></h4>
                    </div>
                    <div class="card-body">
                        <form id="edit">
                            <input id="id" name="id" th:value="${product.id}" type="hidden">
                            <div class="row mb-3">
                                <label class="col-md-4 col-form-label text-md-end " for="category_id">Category:</label>
                                <div class="col-md-6">
                                    <select class="form-select" id="category_id" name="category_id" required>
                                        <option selected th:value="${product.category.id}">
                                            keep the same
                                        </option>
                                        <option th:each="category: ${categories}"
                                                th:text="${category.title}"
                                                th:value="${category.id}">
                                        </option>
                                    </select>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <label class="col-md-4 col-form-label text-md-end " for="title">Title:</label>
                                <div class="col-md-6">
                                    <input autocomplete="off"
                                           class="form-control"
                                           id="title"
                                           name="title"
                                           placeholder="Product title" required
                                           th:value="${product.title}"
                                           type="text">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <label class="col-md-4 col-form-label text-md-end " for="price">Price in €:</label>
                                <div class="col-md-6">
                                    <input autocomplete="off"
                                           class="form-control"
                                           id="price"
                                           name="price"
                                           placeholder="Product price" required
                                           th:value="${product.price}"
                                           type="number">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <label class="col-md-4 col-form-label text-md-end " for="brand">Brand:</label>
                                <div class="col-md-6">
                                    <input autocomplete="off"
                                           class="form-control"
                                           id="brand"
                                           name="brand"
                                           placeholder="Product brand"
                                           th:value="${product.brand}"
                                           type="text">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <label class="col-md-4 col-form-label text-md-end " for="color">Color:</label>
                                <div class="col-md-6">
                                    <input autocomplete="off"
                                           class="form-control"
                                           id="color"
                                           name="color"
                                           placeholder="Product color"
                                           th:value="${product.color}"
                                           type="text">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <label class="col-md-4 col-form-label text-md-end " for="weight">Weight in Kg:</label>
                                <div class="col-md-6">
                                    <input autocomplete="off"
                                           class="form-control"
                                           id="weight"
                                           name="weight"
                                           placeholder="Product weight:"
                                           th:value="${product.weight}"
                                           type="number">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <label class="col-md-4 col-form-label text-md-end " for="volume">Volume in m3:</label>
                                <div class="col-md-6">
                                    <input autocomplete="off"
                                           class="form-control"
                                           id="volume"
                                           name="volume"
                                           placeholder="Product volume"
                                           th:value="${product.volume}"
                                           type="number">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <label class="col-md-4 col-form-label text-md-end " for="quantity">Quantity:</label>
                                <div class="col-md-6">
                                    <input autocomplete="off"
                                           class="form-control"
                                           id="quantity"
                                           name="quantity"
                                           placeholder="Product quantity"
                                           th:value="${product.quantity}"
                                           type="number">
                                </div>
                            </div>

                            <div class="row mb-0">
                                <div class="col-md-8 offset-md-4">
                                    <button class="btn btn-primary" type="submit"><span>Edit</span></button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


</body>
</html>
