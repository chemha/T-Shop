<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">
    <meta content="" name="description">
    <meta content="" name="author">

    <title>T-Shop - Product edit</title>

    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">

    <!-- Custom styles for this template -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">

    <!-- JQuery core JS -->
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/js/csrf.js}"></script>

    <!-- Bootstrap core JS -->
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

    <!-- Custom JS -->
    <script th:src="@{/js/products/create.js}" type="text/javascript"></script>

</head>

<body>

<div th:include="base_template::header"></div>

<div class="container p-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark text-white">
                <div class="card-header">
                    <h4 th:text="'Creating product:'"></h4>
                </div>
                <div class="card-body">
                    <form id="create">
                        <div class="row mb-3">
                            <label class="col-md-4 col-form-label text-md-end " for="category_id">Category:</label>
                            <div class="col-md-6">
                                <select class="form-select" id="category_id" name="category_id" required>
                                    <option disabled selected value="">
                                        Select category
                                    </option>
                                    <option th:each="category: ${categories}"
                                            th:text="${category.title}"
                                            th:value="${category.id}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label class="col-md-4 col-form-label text-md-end " for="title">Title:</label>
                            <div class="col-md-6">
                                <input autocomplete="off"
                                       class="form-control"
                                       id="title"
                                       name="title"
                                       placeholder="Product title" required
                                       type="text">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label class="col-md-4 col-form-label text-md-end " for="price">Price in €:</label>
                            <div class="col-md-6">
                                <input autocomplete="off"
                                       class="form-control"
                                       id="price"
                                       name="price"
                                       placeholder="Product price" required
                                       type="number">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label class="col-md-4 col-form-label text-md-end " for="brand">Brand:</label>
                            <div class="col-md-6">
                                <input autocomplete="off"
                                       class="form-control"
                                       id="brand"
                                       name="brand"
                                       placeholder="Product brand"
                                       type="text">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label class="col-md-4 col-form-label text-md-end " for="color">Color:</label>
                            <div class="col-md-6">
                                <input autocomplete="off"
                                       class="form-control"
                                       id="color"
                                       name="color"
                                       placeholder="Product color"
                                       type="text">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label class="col-md-4 col-form-label text-md-end " for="weight">Weight in Kg:</label>
                            <div class="col-md-6">
                                <input autocomplete="off"
                                       class="form-control"
                                       id="weight"
                                       name="weight"
                                       placeholder="Product weight:"
                                       type="number">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label class="col-md-4 col-form-label text-md-end " for="volume">Volume in m3:</label>
                            <div class="col-md-6">
                                <input autocomplete="off"
                                       class="form-control"
                                       id="volume"
                                       name="volume"
                                       placeholder="Product volume"
                                       type="number">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label class="col-md-4 col-form-label text-md-end " for="quantity">Quantity:</label>
                            <div class="col-md-6">
                                <input autocomplete="off"
                                       class="form-control"
                                       id="quantity"
                                       name="quantity"
                                       placeholder="Product quantity"
                                       type="number">
                            </div>
                        </div>

                        <div class="row mb-0">
                            <div class="col-md-8 offset-md-4">
                                <button class="btn btn-primary" type="submit"><span>Create</span></button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
