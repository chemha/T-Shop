<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no"
          name="viewport">
    <meta content="" name="description">
    <meta content="" name="author">
    <title>T-Shop</title>

    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <!-- Bootstrap Icons core CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Datatables core CSS -->
    <link href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/responsive/2.2.9/css/responsive.bootstrap5.min.css" rel="stylesheet">

    <!-- Custom styles -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">

    <!-- JQuery core JS -->
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>

    <!-- Bootstrap core JS -->
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

    <!-- SweetAlert core JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/2.1.0/sweetalert.min.js"></script>

    <!-- Datatables core JS -->
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.2.9/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.2.9/js/responsive.bootstrap5.min.js"></script>

    <!-- Custom JS -->
    <script th:src="@{/js/categories/index.js}" type="text/javascript"></script>
</head>

<body>

<div th:include="base_template::header"></div>

<div class="container">
    <header class="jumbotron my-4">
        <h1 class="display-3">Categories</h1>
        <p class="lead">Category management</p>
    </header>

    <div class="container">
        <button class="btn btn-secondary mb-3" data-bs-toggle="modal" data-bs-target="#createModal">Create new category</button>
        <table class="table table-bordered table-striped shadow-lg w-100 text-nowrap text-center" id="category-table">
            <thead>
            <tr>
                <th scope="col">Title</th>
                <th scope="col">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="category: ${categories}">
                <td><span th:text="${category.title}"></span></td>
                <td>
                    <button class="btn btn-warning" id="editBtn" th:data-id="${category.id}" th:data-title="${category.title}" th:onclick="openEditModal(this)">
                        <i class="bi bi-pencil-square"></i>
                    </button>
                    <button class="btn btn-danger" id="delBtn" th:onclick="'confirmDeletion(' + ${category.id} + ')'">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div aria-hidden="true" aria-labelledby="editModal" class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="editModalLabel"></h1>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <form id="editForm">
                <div class="modal-body">
                    <input type="hidden" id="editFormId">
                    <input class="form-control" id="editFormTitle" placeholder="Category title" required type="text">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
                    <button class="btn btn-primary" type="submit">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal -->
<div aria-hidden="true" aria-labelledby="createModal" class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="createModalLabel">Creating category</h1>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <form id="createForm">
                <div class="modal-body">
                    <input type="hidden" id="createFormId">
                    <input class="form-control" id="createFormTitle" placeholder="Category title" required type="text">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
                    <button class="btn btn-primary" type="submit">Create</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>

</html>
