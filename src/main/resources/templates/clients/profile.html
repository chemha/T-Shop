<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">
    <meta content="" name="description">
    <meta content="" name="author">

    <title>T-Shop - Login</title>

    <!-- Bootstrap core CSS -->
    <link rel="stylesheet"
          th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">

    <!-- Custom styles for this template -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">

    <!-- Bootstrap core JavaScript -->
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</head>

<body>

<div th:include="base_template::header"></div>
<!-- Page Content -->
<div class="container p-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark text-white">
                <div class="card-header">
                    <h1>Profile</h1>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <h2 th:text="${client.email}">Email</h2>
                    </div>

                    <div class="row mb-3">
                        <h3 th:text="${client.name} + ' ' + ${client.surname}">Name and Surname</h3>
                    </div>

                    <div class="row mb-3">
                        <h4 th:text="${client.birthdate}">Birthdate</h4>
                    </div>
                </div>
                <div class="card-footer">
                    <div class="row mb-0">
                        <div>
                            <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#editModal">Modify client data</button>
                            <button class="btn btn-warning mb-3" data-bs-toggle="modal" data-bs-target="#passwordModal">Change password</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div aria-hidden="true" aria-labelledby="passwordModal" class="modal fade" id="passwordModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="passwordModalLabel">Changing password</h1>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <form id="passwordForm" method="post" action="/clients/password">
                <div class="modal-body">
                    <input class="form-control" id="passwordModalTitle" name="password" placeholder="New password" required type="text">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
                    <button class="btn btn-primary" type="submit">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal -->
<div aria-hidden="true" aria-labelledby="editModal" class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="createModalLabel">Modifying client data</h1>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <form id="editForm" action="/clients/edit" method="post">
                <div class="row mb-3">
                    <label for="editFormName" class="col-md-4 col-form-label text-md-end ">Name:</label>
                    <div class="col-md-6">
                        <input type="text" class="form-control" id="editFormName" name="name"
                               placeholder="Administrator name" required
                               th:value="${client.name}"
                               autocomplete="off">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="editFormSurname" class="col-md-4 col-form-label text-md-end ">Surname:</label>
                    <div class="col-md-6">
                        <input type="text" class="form-control" id="editFormSurname" name="surname"
                               placeholder="Administrator surname" required
                               th:value="${client.surname}"
                               autocomplete="off">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="editFormBirthdate" class="col-md-4 col-form-label text-md-end ">Birthdate:</label>
                    <div class="col-md-6">
                        <input type="date" class="form-control" id="editFormBirthdate" name="birthdate"
                               required
                               th:value="${client.birthdate}"
                               autocomplete="off">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="editFormEmail" class="col-md-4 col-form-label text-md-end ">Email address:</label>
                    <div class="col-md-6">
                        <input type="email" class="form-control" id="editFormEmail" name="email"
                               placeholder="admin@email.here" required
                               th:value="${client.email}"
                               autocomplete="off">
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
                    <button class="btn btn-primary" type="submit">Modify</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
