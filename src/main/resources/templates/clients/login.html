<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>T-Shop - Login</title>

    <!-- Bootstrap core CSS -->
    <link th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"
          rel="stylesheet">

    <!-- Custom styles for this template -->
    <link th:href="@{/css/custom.css}" rel="stylesheet">

</head>

<body>

<div th:include="base_template::header"></div>
<!-- Page Content -->
<div class="container p-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark text-white">
                <div class="card-header">
                    <h4>Login</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/clients/login}" method="post">
                        <div class="row mb-3">
                            <label for="email" class="col-md-4 col-form-label text-md-end ">Email address:</label>
                            <div class="col-md-6">
                                <input type="email" class="form-control" id="email" name="email"
                                       placeholder="your@email.here" required
                                       autocomplete="off">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label for="password" class="col-md-4 col-form-label text-md-end">Password:</label>
                            <div class="col-md-6">
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="password" required>
                            </div>
                        </div>
                        <div class="row mb-0">
                            <div class="col-md-8 offset-md-4">
                                <button type="submit" class="btn btn-primary"><span>Login</span></button>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="card-footer">
                    <span>Dont have an account? <a href="/clients/register" class="card-link">Register</a></span>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Bootstrap core JavaScript -->
<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
