<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>T-Shop - Register</title>

    <!-- Bootstrap core CSS -->
    <link th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"
          rel="stylesheet">

    <!-- Custom styles for this template -->
    <link th:href="@{/css/custom.css}" rel="stylesheet">

</head>

<body>

<div th:include="base_template::header"></div>

<!-- Page Content -->
<div class="container p-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark text-white">
                <div class="card-header">
                    <h4>Register</h4>
                </div>
                <div class="card-body">
                    <form id="register">
                        <div class="row mb-3">
                            <label for="name" class="col-md-4 col-form-label text-md-end ">Name:</label>
                            <div class="col-md-6">
                                <input type="text" class="form-control" id="name" name="name"
                                       placeholder="Your name here" required
                                       autocomplete="off">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <label for="surname" class="col-md-4 col-form-label text-md-end ">Surname:</label>
                            <div class="col-md-6">
                                <input type="text" class="form-control" id="surname" name="surname"
                                       placeholder="Your surname here" required
                                       autocomplete="off">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <label for="birthdate" class="col-md-4 col-form-label text-md-end ">Birthdate:</label>
                            <div class="col-md-6">
                                <input type="date" class="form-control" id="birthdate" name="birthdate"
                                       placeholder="Your surname here" required
                                       autocomplete="off">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label for="email" class="col-md-4 col-form-label text-md-end ">Email address:</label>
                            <div class="col-md-6">
                                <input type="email" class="form-control" id="email" name="email"
                                       placeholder="your@email.here" required
                                       autocomplete="off">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label for="password" class="col-md-4 col-form-label text-md-end">Password:</label>
                            <div class="col-md-6">
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="password" required>
                            </div>
                        </div>

                        <div class="row mb-0">
                            <div class="col-md-8 offset-md-4">
                                <button type="submit" class="btn btn-primary"><span>Sing up</span></button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap core JavaScript -->
<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/js/csrf.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script type="text/javascript" th:src="@{/js/clients/register.js}"></script>

</body>
</html>
