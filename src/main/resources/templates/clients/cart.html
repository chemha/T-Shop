<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no"
          name="viewport">
    <meta content="" name="description">
    <meta content="" name="author">
    <title>T-Shop</title>

    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <!-- Bootstrap Icons core CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Datatables core CSS -->
    <link href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/responsive/2.2.9/css/responsive.bootstrap5.min.css" rel="stylesheet">

    <!-- Custom styles -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">

    <!-- JQuery core JS -->
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/js/csrf.js}"></script>

    <!-- Bootstrap core JS -->
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

    <!-- SweetAlert core JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/2.1.0/sweetalert.min.js"></script>

    <!-- Datatables core JS -->
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.2.9/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.2.9/js/responsive.bootstrap5.min.js"></script>

    <!-- Custom JS -->
    <script th:src="@{/js/home.js}" type="text/javascript"></script>
</head>

<body>

<div th:include="base_template::header"></div>

<div class="container">
    <header class="jumbotron my-4">
        <h1 class="display-3">Cart</h1>
        <p class="lead">Cart management</p>
    </header>

    <div class="container-fluid">
        <div class="alert alert-success" role="alert" th:if="${success}" th:text="${success}"></div>
        <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
        <button class="btn btn-secondary mb-3" data-bs-target="#createModal" data-bs-toggle="modal"
                th:if="${session.userId}">Place order
        </button>
        <a class="btn btn-secondary mb-3" href="/clients/login" th:unless="${session.userId}">Place order</a>

        <table class="table table-bordered table-striped shadow-lg w-100 text-nowrap text-center" id="product-table">
            <thead>
            <tr>
                <th scope="col">Product name</th>
                <th scope="col">Quantity</th>
                <th scope="col">Price</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product: ${session.cart.entrySet()}">
                <td><span th:text="${product.key.title}"></span></td>
                <td><span th:text="${product.value}"></span></td>
                <td>
                    <div class="row">
                        <div class="col">
                            <form th:action="@{/modifyCart}" method="post">
                                <div class="d-flex align-items-center">
                                    <input name="productId" th:value="${product.key.id}" type="hidden">
                                    <input class="form-control mr-2" min="1" name="cartQuantity"
                                           th:value="${product.value}" type="number">
                                    <button class="btn btn-primary" type="submit">
                                        <i class="bi bi-pencil-square"></i>
                                    </button>
                                </div>
                            </form>
                        </div>
                        <div class="col">
                            <form th:action="@{/removeCart}" method="post">
                                <input name="productId" th:value="${product.key.id}" type="hidden">
                                <button class="btn btn-danger" type="submit">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        <h1 th:text="'Final price: ' + ${price} + '€'"></h1>
    </div>
</div>

<!-- Modal -->
<div aria-hidden="true" aria-labelledby="createModal" class="modal fade" id="createModal" tabindex="-1" th:if="${session.userId}">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="createModalLabel">Placing order</h1>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <form id="createForm" method="post" th:action="@{/orders/create}">
                <div class="modal-body">
                    <div class="container">
                        <div class="row row mb-3">
                            <div class="col">
                                <select class="form-select" id="createFormAddress" name="addressId" required>
                                    <option disabled selected value="">
                                        Select address
                                    </option>
                                    <option th:each="address: ${addresses}"
                                            th:text="${address.street + ' ' + address.home + ' ' + address.apartment + ', ' + address.postalCode + ', ' + address.country}"
                                            th:value="${address.id}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="row row mb-3">
                            <div class="col">
                                <select class="form-select" id="createFormPayment" name="payment" required>
                                    <option disabled selected value="">
                                        Select payment method
                                    </option>
                                    <option value="Cash">Cash</option>
                                    <option value="Card">Card</option>
                                </select>
                            </div>
                        </div>

                        <div class="row row mb-3">
                            <div class="col">
                                <select class="form-select" id="createFormDelivery" name="delivery" required>
                                    <option disabled selected value="">
                                        Select delivery method
                                    </option>
                                    <option value="Free">Free</option>
                                    <option value="Premium">Premium</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
                    <button class="btn btn-primary" type="submit">Place order</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>

</html>
