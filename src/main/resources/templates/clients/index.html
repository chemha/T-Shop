<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no"
          name="viewport">
    <meta content="" name="description">
    <meta content="" name="author">
    <title>T-Shop</title>

    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <!-- Bootstrap Icons core CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Datatables core CSS -->
    <link href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/responsive/2.2.9/css/responsive.bootstrap5.min.css" rel="stylesheet">

    <!-- Custom styles -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">

    <!-- JQuery core JS -->
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>

    <!-- Bootstrap core JS -->
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

    <!-- SweetAlert core JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/2.1.0/sweetalert.min.js"></script>

    <!-- Datatables core JS -->
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.2.9/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.2.9/js/responsive.bootstrap5.min.js"></script>

    <!-- Custom JS -->
    <script th:src="@{/js/clients/index.js}" type="text/javascript"></script>
</head>

<body>

<div th:include="base_template::header"></div>

<div class="container">
    <header class="jumbotron my-4">
        <h1 class="display-3">Clients</h1>
        <p class="lead">Client management</p>
    </header>

    <div class="container">
        <button class="btn btn-secondary mb-3" data-bs-toggle="modal" data-bs-target="#createModal">Create new administrator</button>
        <table class="table table-bordered table-striped shadow-lg w-100 text-nowrap text-center" id="client-table">
            <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Surname</th>
                <th scope="col">Birthdate</th>
                <th scope="col">Email</th>
                <th scope="col">Admin</th>
                <th scope="col">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="client: ${clients}">
                <td><span th:text="${client.name}"></span></td>
                <td><span th:text="${client.surname}"></span></td>
                <td><span th:text="${client.birthdate}"></span></td>
                <td><span th:text="${client.email}"></span></td>
                <td>
                    <i th:if="${client.admin}" class="bi bi-check-square-fill"></i>
                    <i th:unless="${client.admin}" class="bi bi-x-square-fill"></i>
                </td>
                <td>
                    <button class="btn btn-warning" id="editBtn"
                            th:data-id="${client.id}"
                            th:data-name="${client.name}"
                            th:data-surname="${client.surname}"
                            th:data-birthdate="${client.birthdate}"
                            th:data-email="${client.email}"
                            th:data-admin="${client.admin}"
                            th:onclick="openEditModal(this)">
                        <i class="bi bi-pencil-square"></i>
                    </button>
                    <button class="btn btn-danger" id="delBtn" th:onclick="'confirmDeletion(' + ${client.id} + ')'">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div aria-hidden="true" aria-labelledby="editModal" class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="editModalLabel"></h1>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <form id="editForm">
                <div class="modal-body">
                    <input type="hidden" id="editFormId">
                    <input type="hidden" id="editFormName">
                    <input type="hidden" id="editFormSurname">
                    <input type="hidden" id="editFormBirthdate">
                    <input type="hidden" id="editFormEmail">
                    <input type="hidden" id="editFormAdmin">
                    <input class="form-control" id="editFormPassword" placeholder="New password" required type="text">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
                    <button class="btn btn-primary" type="submit">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal -->
<div aria-hidden="true" aria-labelledby="createModal" class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="createModalLabel">Creating administrator</h1>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <form id="createForm">
                <div class="row mb-3">
                    <label for="createFormName" class="col-md-4 col-form-label text-md-end ">Name:</label>
                    <div class="col-md-6">
                        <input type="text" class="form-control" id="createFormName" name="name"
                               placeholder="Administrator name" required
                               autocomplete="off">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="createFormSurname" class="col-md-4 col-form-label text-md-end ">Surname:</label>
                    <div class="col-md-6">
                        <input type="text" class="form-control" id="createFormSurname" name="surname"
                               placeholder="Administrator surname" required
                               autocomplete="off">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="createFormBirthdate" class="col-md-4 col-form-label text-md-end ">Birthdate:</label>
                    <div class="col-md-6">
                        <input type="date" class="form-control" id="createFormBirthdate" name="birthdate"
                               required
                               autocomplete="off">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="createFormEmail" class="col-md-4 col-form-label text-md-end ">Email address:</label>
                    <div class="col-md-6">
                        <input type="email" class="form-control" id="createFormEmail" name="email"
                               placeholder="admin@email.here" required
                               autocomplete="off">
                    </div>
                </div>

                <div class="row mb-3">
                    <label for="createFormPassword" class="col-md-4 col-form-label text-md-end">Password:</label>
                    <div class="col-md-6">
                        <input type="password" class="form-control" id="createFormPassword" name="password"
                               placeholder="password" required>
                    </div>
                </div>
                <input type="hidden" id="createFormAdmin" value="true">

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
                    <button class="btn btn-primary" type="submit">Create</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>

</html>
