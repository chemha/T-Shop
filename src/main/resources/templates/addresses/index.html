<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no"
          name="viewport">
    <meta content="" name="description">
    <meta content="" name="author">
    <title>T-Shop</title>

    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <!-- Bootstrap Icons core CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Datatables core CSS -->
    <link href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/responsive/2.2.9/css/responsive.bootstrap5.min.css" rel="stylesheet">

    <!-- Custom styles -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">

    <!-- JQuery core JS -->
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>

    <!-- Bootstrap core JS -->
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

    <!-- SweetAlert core JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/2.1.0/sweetalert.min.js"></script>

    <!-- Datatables core JS -->
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.2.9/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.2.9/js/responsive.bootstrap5.min.js"></script>

    <!-- Custom JS -->
    <script th:src="@{/js/addresses/index.js}" type="text/javascript"></script>
</head>

<body>

<div th:include="base_template::header"></div>

<div class="container">
    <header class="jumbotron my-4">
        <h1 class="display-3">Addresses</h1>
        <p class="lead">Address management</p>
    </header>

    <div class="container">
        <button class="btn btn-secondary mb-3" data-bs-target="#createModal" data-bs-toggle="modal">Create new address
        </button>
        <table class="table table-bordered table-striped shadow-lg w-100 text-nowrap text-center" id="address-table">
            <thead>
            <tr>
                <th scope="col">Country</th>
                <th scope="col">Postal code</th>
                <th scope="col">Street</th>
                <th scope="col">Home</th>
                <th scope="col">Apartment</th>
                <th scope="col">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="address: ${addresses}">
                <td><span th:text="${address.country}"></span></td>
                <td><span th:text="${address.postalCode}"></span></td>
                <td><span th:text="${address.street}"></span></td>
                <td><span th:text="${address.home}"></span></td>
                <td><span th:text="${address.apartment}"></span></td>

                <td>
                    <button class="btn btn-warning" id="editBtn"
                            th:data-id="${address.id}"
                            th:data-country="${address.country}"
                            th:data-postal="${address.postalCode}"
                            th:data-street="${address.street}"
                            th:data-home="${address.home}"
                            th:data-apartment="${address.apartment}"
                            th:onclick="openEditModal(this)">

                        <i class="bi bi-pencil-square"></i>
                    </button>
                    <button class="btn btn-danger" id="delBtn" th:onclick="'confirmDeletion(' + ${address.id} + ')'">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div aria-hidden="true" aria-labelledby="editModal" class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="editModalLabel">Editing address</h1>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <form id="editForm">
                <div class="modal-body">
                    <div class="row row mb-3">
                        <div class="col">
                            <label for="editFormCountry">Country</label>
                            <input class="form-control" id="editFormCountry" name="country" placeholder="Country name"
                                   required
                                   type="text">
                        </div>
                    </div>
                    <div class="row row mb-3">
                        <div class="col">
                            <label for="editFormPostalCode">Postal Code</label>
                            <input class="form-control" id="editFormPostalCode" name="postalCode" placeholder="Postal code" required
                                   type="text">
                        </div>
                    </div>
                    <div class="row row mb-3">
                        <div class="col">
                            <label for="editFormStreet">Street</label>
                            <input class="form-control" id="editFormStreet" name="street" placeholder="Country name" required
                                   type="text">
                        </div>
                    </div>
                    <div class="row row mb-3">
                        <div class="col">
                            <label for="editFormHome">Home</label>
                            <input class="form-control" id="editFormHome" name="home" placeholder="Home number"
                                   type="text">
                        </div>
                    </div>
                    <div class="row row mb-3">
                        <div class="col">
                            <label for="createFormApartment">Apartment</label>
                            <input class="form-control" id="editFormApartment" name="apartment" placeholder="Apartement number"
                                   type="text">
                        </div>
                    </div>
                    <input id="editFormUserId" type="hidden" th:value="${session.userId}">
                    <input id="editFormId" type="hidden">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
                    <button class="btn btn-primary" type="submit">Create</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal -->
<div aria-hidden="true" aria-labelledby="createModal" class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="createModalLabel">Creating address</h1>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <form id="createForm">
                <div class="modal-body">
                    <div class="row row mb-3">
                        <div class="col">
                            <label for="createFormCountry">Country</label>
                            <input class="form-control" id="createFormCountry" name="country" placeholder="Country name"
                                   required
                                   type="text">
                        </div>
                    </div>
                    <div class="row row mb-3">
                        <div class="col">
                            <label for="createFormPostalCode">Postal Code</label>
                            <input class="form-control" id="createFormPostalCode" name="postalCode" placeholder="Postal code" required
                                   type="text">
                        </div>
                    </div>
                    <div class="row row mb-3">
                        <div class="col">
                            <label for="createFormStreet">Street</label>
                            <input class="form-control" id="createFormStreet" name="street" placeholder="Country name" required
                                   type="text">
                        </div>
                    </div>
                    <div class="row row mb-3">
                        <div class="col">
                            <label for="createFormHome">Home</label>
                            <input class="form-control" id="createFormHome" name="home" placeholder="Home number"
                                   type="text">
                        </div>
                    </div>
                    <div class="row row mb-3">
                        <div class="col">
                            <label for="createFormApartment">Apartment</label>
                            <input class="form-control" id="createFormApartment" name="apartment" placeholder="Apartement number"
                                   type="text">
                        </div>
                    </div>
                    <input id="createFormUserId" type="hidden" th:value="${session.userId}">

                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
                    <button class="btn btn-primary" type="submit">Create</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>

</html>
