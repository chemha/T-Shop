<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- Navigation -->
<div th:fragment="header">
    <nav class="navbar navbar-expand-md navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand" th:href="@{/}">T-Shop</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="{{ __('Toggle navigation') }}">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/cart}">Cart</a></li>
                    <li th:if="${session.userId==null}" class="nav-item"><a class="nav-link" th:href="@{/clients/login}">Login</a></li>
                    <li th:if="${session.userId==null}" class="nav-item"><a class="nav-link" th:href="@{/clients/register}">Register</a></li>
                    <li th:if="${session.userId!=null}" class="nav-item"><a class="nav-link" th:href="@{/orders/index}">Orders</a></li>
                    <li th:if="${session.userId!=null}" class="nav-item"><a class="nav-link" th:href="@{/client-addresses/index}">Addresses</a></li>
                    <li th:if="${session.admin}" class="nav-item"><a class="nav-link" th:href="@{/categories/index}">Categories</a></li>
                    <li th:if="${session.admin}" class="nav-item"><a class="nav-link" th:href="@{/clients/index}">Clients</a></li>
                    <li th:if="${session.admin}" class="nav-item"><a class="nav-link" th:href="@{/orders/all}">Client's orders</a></li>
                </ul>
                <ul th:if="${session.userId!=null}" class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a id="navbarDropdown" class="nav-link dropdown-toggle text-white" href="#" role="button"
                           data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false" v-pre th:text="${session.userName}"></a>
                        <div class="dropdown-menu dropdown-menu-end bg-dark"
                             aria-labelledby="navbarDropdownMenuLink">
                            <a class="dropdown-item text-white bg-dark" th:href="@{/clients/profile}">Profile</a>
                            <form th:action="@{/clients/logout}" method="post">
                                <button type="submit" class="dropdown-item text-white bg-dark">Log out</button>
                            </form>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>

<!-- Footer -->
<div th:fragment="footer">
    <footer class="py-3 bg-dark fixed-bottom">
        <div class="container">
            <p class="m-0 text-center text-white">Copyright &copy; T-Shop - José María Velázquez Crespo</p>
        </div>
    </footer>
</div>
</html>
