server:
  port: 9000

spring:
  application:
    name: tshop
  threads:
    virtual:
      enabled: true
  jpa:
    # Never let a view trigger lazy loading: every query must happen inside a service
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it
      ddl-auto: validate
    properties:
      # Lazy collections and proxies are loaded in batches of up to 50 ids (WHERE id IN (...))
      # instead of one query each: the usual fix for the N+1 problem when JOIN FETCH can't be used
      hibernate.default_batch_fetch_size: 50
  flyway:
    # db/migration holds the schema, db/demo the sample data (left out in the prod profile)
    locations: classpath:db/migration,classpath:db/demo
  # Locally, spring-boot-docker-compose starts compose.yaml and wires the datasource,
  # so no connection settings are needed here

management:
  endpoints:
    web:
      exposure:
        # Only what a load balancer or orchestrator needs. Everything else (env, beans, heapdump...)
        # can reveal secrets and stays off
        include: health, info
  endpoint:
    health:
      # /actuator/health/liveness and /actuator/health/readiness, as Kubernetes expects
      probes:
        enabled: true
  info:
    build:
      enabled: true

springdoc:
  # Contract-first: Swagger UI shows openapi.yaml itself instead of a spec generated from the code
  swagger-ui:
    url: /openapi.yaml
