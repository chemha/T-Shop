      responses:
        '200':
          description: The updated client address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientAddress'

    delete:
      summary: Delete the existing address by its ID
      operationId: deleteClientAddress
      tags:
        - ClientAddress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The ID of an existing client address
      responses:
        '204':
          description: No content upon successful client address deletion

  /products:
