components:
  schemas:
    Client:
      allOf:
        - $ref: '#/components/schemas/ClientProperties'
        - type: object
          properties:
            id:
              type: integer
    ClientProperties:
      properties:
        name:
          type: string
        surname:
          type: string
        birthdate:
          type: string
        email:
          type: string
        password:
          type: string
        admin:
          type: boolean
      required:
        - name
        - surname
        - birthdate
        - email
        - password
    ClientSearchResult:
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Client'
        pageCount:
          type: integer
        pageNumber:
          type: integer
        pageSize:
          type: integer

    ClientAddress:
      allOf:
        - $ref: '#/components/schemas/ClientAddressProperties'
        - type: object
          properties:
            id:
              type: integer
    ClientAddressProperties:
      properties:
        client_id:
          type: integer
        country:
          type: string
        postal_code:
          type: string
        street:
          type: string
        home:
          type: string
        apartment:
          type: boolean
      required:
        - client_id
        - country
        - postal_code
        - street
    ClientAddressSearchResult:
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ClientAddress'
        pageCount:
          type: integer
        pageNumber:
          type: integer
        pageSize:
          type: integer

    Product:
      allOf:
        - $ref: '#/components/schemas/ProductProperties'
        - type: object
          properties:
            id:
              type: integer
    ProductProperties:
      properties:
        category_id:
          type: integer
        title:
          type: string
        price:
          type: float
        brand:
          type: string
        color:
          type: string
        weight:
          type: float
        volume:
          type: float
        quantity:
          type: integer
      required:
        - category_id
        - title
        - price
    ProductSearchResult:
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pageCount:
          type: integer
        pageNumber:
          type: integer
        pageSize:
          type: integer

    Good:
      allOf:
        - $ref: '#/components/schemas/GoodProperties'
        - type: object
          properties:
            id:
              type: integer
    GoodProperties:
      properties:
        order_id:
          type: integer
        product_id:
          type: integer
        quantity:
          type: integer
      required:
        - order_id
        - product_id
    GoodSearchResult:
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Good'
        pageCount:
          type: integer
        pageNumber:
          type: integer
        pageSize:
          type: integer

    Order:
      allOf:
        - $ref: '#/components/schemas/OrderProperties'
        - type: object
          properties:
            id:
              type: integer
    OrderProperties:
      properties:
        client_id:
          type: integer
        address_id:
          type: integer
        payment_method:
          type: string
        delivery_method:
          type: string
        payment_status:
          type: string
        order_status:
          type: string
      required:
        - client_id
        - address_id
        - payment_method
        - delivery_method
        - payment_status
        - order_status
    OrderSearchResult:
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        pageCount:
          type: integer
        pageNumber:
          type: integer
        pageSize:
          type: integer

    Category:
      allOf:
        - $ref: '#/components/schemas/CategoryProperties'
        - type: object
          properties:
            id:
              type: integer
    CategoryProperties:
      properties:
        title:
          type: integer
      required:
        - title
    CategorySearchResult:
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        pageCount:
          type: integer
        pageNumber:
          type: integer
        pageSize:
          type: integer