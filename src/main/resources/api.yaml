openapi: "3.0.0"

info:
  title: T-Shop
  version: 1.0.0

servers:
  - url: http://localhost:8080/

tags:
  - name: Client
    description: Everything about clients

paths:
  /clients:
    get:
      summary: List all clients
      operationId: getClientSearchResult
      tags:
        - Client
      parameters:
        - in: query
          name: pageNumber
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
      responses:
        '200':
          description: A paged array of clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSearchResult"

    post:
      summary: Create a client
      operationId: createClient
      tags:
        - Client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientProperties'
      responses:
        '201':
          description: The new created client

  /clients/{id}:
    get:
      summary: Get the existing client by its ID
      operationId: getClient
      tags:
        - Client
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the client to retrieve
      responses:
        '200':
          description: The requested client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

    put:
      summary: Update the existing client by its ID
      operationId: updateClient
      tags:
        - Client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The ID of an existing client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientProperties'
      responses:
        '200':
          description: The updated client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'

    delete:
      summary: Delete the existing client by its ID
      operationId: deleteClient
      tags:
        - Client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The ID of an existing client
      responses:
        '204':
          description: No content upon successful client deletion

components:
  schemas:
    Client:
      allOf:
        - $ref: '#/components/schemas/ClientProperties'
        - type: object
          properties:
            id:
              type: integer

    ClientProperties:
      properties:
        name:
          type: string
        surname:
          type: string
        birthdate:
          type: string
        email:
          type: string
        password:
          type: string
        admin:
          type: boolean
      required:
        - name
        - surname
        - birthdate
        - email
        - password

    ClientSearchResult:
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Client'
        pageCount:
          type: integer
        pageNumber:
          type: integer
        pageSize:
          type: integer