name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Cancel a running build when a newer commit arrives on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # Unit, persistence and API tests. GitHub's Ubuntu runners have Docker,
      # so Testcontainers starts a real PostgreSQL just like locally
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # Regenerates the TypeScript types from openapi.yaml: a contract change that breaks the
      # frontend fails here
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Builds the two images on every run; on main, once all tests pass, also publishes them to
  # GitHub Container Registry so a server only has to pull them (see compose.server.yaml)
  docker:
    runs-on: ubuntu-latest
    needs: [ build, frontend ]
    permissions:
      contents: read
      packages: write
    env:
      # Image names must be lower case, unlike the repository name
      APP_IMAGE: ghcr.io/chemha/t-shop
      WEB_IMAGE: ghcr.io/chemha/t-shop-web
      # Links the published images to this repository on GitHub
      SOURCE: org.opencontainers.image.source=https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: |
          docker build --label "$SOURCE" -t "$APP_IMAGE:latest" -t "$APP_IMAGE:${{ github.sha }}" .
          docker build --label "$SOURCE" -f frontend/Dockerfile -t "$WEB_IMAGE:latest" -t "$WEB_IMAGE:${{ github.sha }}" .

      # "latest" for the demo server; the commit hash to go back to an exact version
      - name: Publish images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push --all-tags "$APP_IMAGE"
          docker push --all-tags "$WEB_IMAGE"
